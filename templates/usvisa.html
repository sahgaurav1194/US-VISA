<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>US Visa Approval Prediction</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; }
        .container { max-width: 560px; margin: 40px auto; background: #fff; padding: 24px 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        h2 { text-align: center; color: #1a3c6e; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        select, input { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 20px; width: 100%; padding: 10px; background: #1a3c6e; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .result { text-align: center; margin-top: 16px; font-size: 18px; color: #0a7d33; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h2>US Visa Approval Prediction</h2>
    <form action="/" method="post">
        <label>Continent</label>
        <select name="continent" required>
            <option>Asia</option><option>Europe</option><option>North America</option>
            <option>South America</option><option>Africa</option><option>Oceania</option>
        </select>

        <label>Education of Employee</label>
        <select name="education_of_employee" required>
            <option>High School</option><option>Bachelor's</option>
            <option>Master's</option><option>Doctorate</option>
        </select>

        <label>Has Job Experience</label>
        <select name="has_job_experience" required><option>Y</option><option>N</option></select>

        <label>Requires Job Training</label>
        <select name="requires_job_training" required><option>N</option><option>Y</option></select>

        <label>Number of Employees</label>
        <input type="number" name="no_of_employees" required>

        <label>Year of Establishment</label>
        <input type="number" name="yr_of_estab" required>

        <label>Region of Employment</label>
        <select name="region_of_employment" required>
            <option>Northeast</option><option>South</option><option>West</option>
            <option>Midwest</option><option>Island</option>
        </select>

        <label>Prevailing Wage</label>
        <input type="number" step="0.01" name="prevailing_wage" required>

        <label>Unit of Wage</label>
        <select name="unit_of_wage" required>
            <option>Year</option><option>Hour</option><option>Week</option><option>Month</option>
        </select>

        <label>Full Time Position</label>
        <select name="full_time_position" required><option>Y</option><option>N</option></select>

        <button type="submit">Predict</button>
    </form>
    <div class="result">{{ context }}</div>
</div>
</body>
</html>
